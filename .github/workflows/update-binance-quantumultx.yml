name: Update Binance Quantumult X rules

on:
  workflow_dispatch:
  schedule:
    - cron: "11 05 * * 1"

permissions:
  contents: write

concurrency:
  group: update-binance-quantumultx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run Binance unit tests
        run: python -m unittest discover -s tests -p "test_binance_rules.py" -v

      - name: Update approved Binance rules
        run: python scripts/update_binance_quantumultx.py --verbose

      - name: Validate Binance files
        run: python scripts/validate_binance_rules.py

      - name: Commit and safely push real changes
        shell: bash
        run: |
          if git diff --quiet -- \
            README.md \
            rule/QuantumultX/Binance/Binance.list \
            rule/QuantumultX/Binance/Binance-Ecosystem.list \
            rule/QuantumultX/Binance/Binance-Regional.list \
            rule/QuantumultX/Binance/README.md; then
            echo "No approved Binance rule changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            rule/QuantumultX/Binance/Binance.list \
            rule/QuantumultX/Binance/Binance-Ecosystem.list \
            rule/QuantumultX/Binance/Binance-Regional.list \
            rule/QuantumultX/Binance/README.md

          if git diff --cached --quiet; then
            echo "No generated Binance files to commit."
            exit 0
          fi

          git commit -m "chore: update Binance QuantumultX rules"
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin "$branch" && \
              git push origin "HEAD:$branch"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Unable to safely push after three attempts." >&2
          exit 1
