name: Update Bybit Quantumult X rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 03 * * 1"

permissions:
  contents: write

concurrency:
  group: update-bybit-quantumultx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update Bybit rules
        run: python scripts/update_bybit_quantumultx.py --verbose

      - name: Validate generated files
        run: python scripts/validate_bybit_rules.py

      - name: Commit and push real changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No rule changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md rule/QuantumultX/Bybit/Bybit.list rule/QuantumultX/Bybit/README.md

          if git diff --cached --quiet; then
            echo "No generated-file changes to commit."
            exit 0
          fi

          git commit -m "chore: update Bybit QuantumultX rules"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
